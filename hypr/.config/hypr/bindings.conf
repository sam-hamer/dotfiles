# Application bindings
$terminal = uwsm app -- ghostty
$browser = omarchy-launch-browser

$hyper = MOD3

bindd = $hyper, T, Terminal, exec, $terminal --working-directory=$(omarchy-cmd-terminal-cwd)
bindd = $hyper, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = $hyper, B, Browser, exec, $browser
bindd = $hyper, return, Activity, exec, $terminal -e btop
bindd = $hyper, N, Obsidian, exec, uwsm app -- obsidian -disable-gpu
bindd = $hyper, slash, Passwords, exec, uwsm app -- 1password
bindd = $hyper, D, Discord, exec, uwsm app -- discord
bindd = $hyper, C, Cursor, exec, uwsm app -- cursor

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = $hyper, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
unbind = SUPER, SPACE
bindd = ALT, SPACE, Launch apps, exec, walker -p "Start…"
bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu